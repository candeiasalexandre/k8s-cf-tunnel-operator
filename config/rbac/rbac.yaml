apiVersion: v1
kind: ServiceAccount
metadata:
  name: cf-tunnel-operator
  namespace: cf-tunnel-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cf-tunnel-operator
rules:
  # Our CRD
  - apiGroups:
      - cloudflare.example.com
    resources:
      - cloudflaretunnels
      - cloudflaretunnels/status
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Ingress adapter
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
      - ingresses/status
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  # Child resources for cloudflared pods
  - apiGroups:
      - ""
    resources:
      - secrets
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Events
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cf-tunnel-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cf-tunnel-operator
subjects:
  - kind: ServiceAccount
    name: cf-tunnel-operator
    namespace: cf-tunnel-system
