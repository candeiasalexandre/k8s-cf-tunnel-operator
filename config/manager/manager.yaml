apiVersion: apps/v1
kind: Deployment
metadata:
  name: cf-tunnel-operator
  namespace: cf-tunnel-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cf-tunnel-operator
  template:
    metadata:
      labels:
        app: cf-tunnel-operator
    spec:
      serviceAccountName: cf-tunnel-operator
      containers:
        - name: manager
          image: cf-tunnel-operator:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: CF_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: cf-operator-secrets
                  key: CF_ACCOUNT_ID
            - name: CF_ZONE_ID
              valueFrom:
                secretKeyRef:
                  name: cf-operator-secrets
                  key: CF_ZONE_ID
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cf-operator-secrets
                  key: CF_API_TOKEN
          ports:
            - containerPort: 8081
              name: healthz
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 15
            periodSeconds: 20
