apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudflaretunnels.cloudflare.example.com
spec:
  group: cloudflare.example.com
  names:
    kind: CloudflareTunnel
    listKind: CloudflareTunnelList
    plural: cloudflaretunnels
    singular: cloudflaretunnel
    shortNames:
      - cft
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - hostname
                - rules
              properties:
                hostname:
                  type: string
                replicas:
                  type: integer
                  nullable: true
                rules:
                  type: array
                  items:
                    type: object
                    required:
                      - path
                      - backend
                    properties:
                      path:
                        type: string
                      backend:
                        type: object
                        required:
                          - serviceName
                          - port
                        properties:
                          serviceName:
                            type: string
                          port:
                            type: integer
            status:
              type: object
              properties:
                tunnelID:
                  type: string
                ready:
                  type: boolean
      subresources:
        status: {}
