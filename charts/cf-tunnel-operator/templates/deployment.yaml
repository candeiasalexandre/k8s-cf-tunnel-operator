apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cf-tunnel-operator.fullname" . }}
  namespace: {{ include "cf-tunnel-operator.namespace" . }}
  labels:
    {{- include "cf-tunnel-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "cf-tunnel-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if not .Values.cloudflare.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
      labels:
        {{- include "cf-tunnel-operator.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "cf-tunnel-operator.fullname" . }}
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: {{ include "cf-tunnel-operator.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CF_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  {{- if .Values.cloudflare.existingSecret }}
                  name: {{ .Values.cloudflare.existingSecret }}
                  {{- else }}
                  name: {{ include "cf-tunnel-operator.fullname" . }}
                  {{- end }}
                  key: CF_ACCOUNT_ID
            - name: CF_ZONE_ID
              valueFrom:
                secretKeyRef:
                  {{- if .Values.cloudflare.existingSecret }}
                  name: {{ .Values.cloudflare.existingSecret }}
                  {{- else }}
                  name: {{ include "cf-tunnel-operator.fullname" . }}
                  {{- end }}
                  key: CF_ZONE_ID
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  {{- if .Values.cloudflare.existingSecret }}
                  name: {{ .Values.cloudflare.existingSecret }}
                  {{- else }}
                  name: {{ include "cf-tunnel-operator.fullname" . }}
                  {{- end }}
                  key: CF_API_TOKEN
            {{- if .Values.tunnelNamePrefix }}
            - name: TUNNEL_NAME_PREFIX
              value: {{ .Values.tunnelNamePrefix | quote }}
            {{- end }}
          ports:
            - containerPort: 8081
              name: healthz
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
